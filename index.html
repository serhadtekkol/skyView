<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SkyView</title>
  <link rel="stylesheet" href="/node_modules/leaflet/dist/leaflet.css" />
  <style>
    :root { --ink: #e8f1ff; --dim: #8fa3bf; --accent: #31d0ff; --panel: rgba(8, 14, 24, 0.86); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); }
    canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10;
      background: radial-gradient(ellipse at 50% 40%, rgba(20,40,70,0.75), rgba(5,10,18,0.96)); }
    .card { width: min(1180px, calc(100vw - 32px)); max-height: calc(100vh - 32px); box-sizing: border-box; background: var(--panel);
      border: 1px solid rgba(120,170,230,0.25); border-radius: 14px; padding: 20px 22px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; overflow: hidden; }
    .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
    h1 { margin: 0 0 2px; font-size: 24px; } .sub { color: var(--dim); font-size: 14px; }
    .grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 18px; min-height: 0; flex: 1; }
    #map { height: min(600px, calc(100vh - 140px)); border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); }
    .side { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; min-height: 0; padding-right: 4px; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; overflow-y: auto; } #map { height: 300px; } }
    .searchbox { position: relative; }
    #search { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.35); color: var(--ink); outline: none; }
    #search:focus { border-color: var(--accent); }
    #results { list-style: none; margin: 4px 0 0; padding: 0; position: absolute; left: 0; right: 0; z-index: 1000; background: #0d1626;
      border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    #results li { padding: 8px 10px; cursor: pointer; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    #results li:hover { background: rgba(49,208,255,0.15); } #results li span { color: var(--dim); }
    .apt-name { font-size: 18px; font-weight: 600; } .apt-sub { color: var(--dim); font-size: 13px; }
    .lbl { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
    #runways { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; }
    .rw { padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); color: var(--ink);
      cursor: pointer; font-weight: 600; font-size: 14px; text-align: left; }
    .rw small { display: block; color: var(--dim); font-weight: 400; font-size: 11px; }
    .rw.on { border-color: #ffd23f; background: rgba(255,210,63,0.15); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button.go { padding: 11px 18px; font-size: 15px; border-radius: 8px; border: 0; cursor: pointer;
      background: linear-gradient(180deg, #34d3ff, #1590c9); color: #02121c; font-weight: 700; }
    button.go.alt { background: rgba(255,255,255,0.1); color: var(--ink); border: 1px solid rgba(255,255,255,0.2); }
    button.go.small { padding: 7px 12px; font-size: 13px; }
    button.go:disabled { opacity: 0.45; cursor: default; }
    .free { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); }
    details { font-size: 13px; color: var(--dim); } summary { cursor: pointer; }
    details table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    details td { padding: 3px 4px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    details td:first-child { color: var(--accent); font-family: Consolas, monospace; white-space: nowrap; }
    .envrow { display: flex; align-items: center; gap: 10px; }
    #hourSel { flex: 1; accent-color: #31d0ff; }
    #hourLbl { font: 13px Consolas, monospace; color: var(--ink); min-width: 150px; }
    #wxSel { width: 100%; padding: 8px 10px; font-size: 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #0d1626; color: var(--ink); }
    #acSel { width: 100%; padding: 9px 10px; font-size: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
      background: #0d1626; color: var(--ink); outline: none; cursor: pointer; }
    #acSel:focus { border-color: var(--accent); }
    .acinfo { color: var(--dim); font-size: 12px; margin-top: 4px; }
    .acview { position: relative; height: 190px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.12);
      background: radial-gradient(ellipse at 50% 35%, #2a3e58 0%, #121b28 70%); flex-shrink: 0; }
    #acView { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #acView:active { cursor: grabbing; }
    #acCap { position: absolute; left: 10px; bottom: 8px; right: 10px; font-size: 12px; color: #dbe7f5; text-shadow: 0 1px 3px #000; pointer-events: none; }
    .achint { position: absolute; right: 10px; top: 8px; font-size: 10px; color: rgba(220,232,245,0.6); pointer-events: none; }
    #status { color: var(--dim); font-size: 13px; min-height: 18px; }
    .leaflet-container { background: #0b1220; font: 12px "Segoe UI", sans-serif; }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas id="hud"></canvas>
  <div id="start"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
