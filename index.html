<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SkyView · Flight Simulator</title>
  <link rel="stylesheet" href="/node_modules/leaflet/dist/leaflet.css" />
  <style>
    :root {
      --ink: #ecf3ff;
      --dim: #8da2be;
      --accent: #31d0ff;
      --amber: #ffbe3b;
      --emerald: #3cf07a;
      --glass: rgba(8, 13, 22, 0.80);
      --glass-strong: rgba(6, 10, 18, 0.92);
      --line: rgba(125, 180, 245, 0.22);
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #060a12; font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: var(--ink); }
    canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; }

    /* Full-bleed dispatch screen */
    #start { position: fixed; inset: 0; z-index: 10; background: #060a12; }
    .dispatch { position: relative; width: 100%; height: 100%; overflow: hidden; }
    #map { position: absolute; inset: 0; z-index: 1; background: #080e1a; }
    .vignette { position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(4, 8, 15, 0.65) 100%),
                  linear-gradient(180deg, rgba(4, 8, 15, 0.72) 0%, transparent 18%, transparent 82%, rgba(4, 8, 15, 0.75) 100%); }

    /* Floating glass panels */
    .hud-ui { position: absolute; inset: 0; z-index: 5; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 14px 16px; box-sizing: border-box; gap: 12px; }
    .panel { pointer-events: auto; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 48px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06); }

    /* Top command bar */
    .topbar { display: flex; align-items: center; gap: 14px; padding: 10px 14px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; padding-right: 14px; border-right: 1px solid rgba(255,255,255,0.1); }
    .brand-mark { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center;
      background: linear-gradient(135deg, rgba(49,208,255,0.22), rgba(21,144,201,0.08)); border: 1px solid rgba(49,208,255,0.45);
      color: var(--accent); font: 700 15px Consolas, monospace; }
    .brand h1 { margin: 0; font: 700 17px/1.1 "Segoe UI", system-ui, sans-serif; letter-spacing: 1.6px; text-transform: uppercase; }
    .brand .sub { font: 600 10px Consolas, monospace; letter-spacing: 1.2px; color: var(--accent); text-transform: uppercase; margin-top: 2px; }

    .searchbox { position: relative; flex: 1; min-width: 220px; max-width: 440px; }
    #search { width: 100%; box-sizing: border-box; padding: 8px 12px 8px 32px; font-size: 13px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.16); background: rgba(4,8,15,0.65); color: var(--ink); outline: none; }
    .searchbox::before { content: '⌕'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--dim); font-size: 15px; pointer-events: none; }
    #search:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(49,208,255,0.16); }
    #results { list-style: none; margin: 6px 0 0; padding: 0; position: absolute; left: 0; right: 0; z-index: 1000;
      background: var(--glass-strong); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 16px 36px rgba(0,0,0,0.75); overflow: hidden; }
    #results li { padding: 9px 12px; cursor: pointer; font-size: 12.5px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    #results li:last-child { border-bottom: 0; }
    #results li:hover { background: rgba(49,208,255,0.16); }
    #results li span { color: var(--dim); }

    .top-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    #status { font: 11px Consolas, monospace; color: var(--dim); padding: 5px 10px; border-radius: 999px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Side docks */
    .docks { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex: 1; min-height: 0; pointer-events: none; }
    .dock { width: 350px; max-height: 100%; overflow-y: auto; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }
    .dock::-webkit-scrollbar { width: 5px; }
    .dock::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 4px; }

    .sec-head { display: flex; justify-content: space-between; align-items: center; font: 700 10px Consolas, monospace; letter-spacing: 1.3px; text-transform: uppercase; color: var(--accent); padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .lbl { color: var(--dim); font: 600 10px Consolas, monospace; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

    /* Aircraft hangar */
    .acview { position: relative; height: 175px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.12);
      background: radial-gradient(ellipse at 50% 35%, #23364f 0%, #0d1522 75%); flex-shrink: 0; }
    #acView { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #acView:active { cursor: grabbing; }
    #acCap { position: absolute; left: 10px; bottom: 8px; right: 10px; font: 600 11.5px "Segoe UI", sans-serif; color: #dbe7f5; text-shadow: 0 1px 3px #000; pointer-events: none; }
    .achint { position: absolute; right: 9px; top: 7px; font: 10px Consolas, monospace; color: rgba(220,232,245,0.55); pointer-events: none; }
    #acSel { width: 100%; padding: 8px 10px; font-size: 13px; font-weight: 600; border-radius: 8px; border: 1px solid rgba(255,255,255,0.16);
      background: rgba(4,8,15,0.75); color: var(--ink); outline: none; cursor: pointer; }
    #acSel:focus { border-color: var(--accent); }
    .acinfo { color: var(--dim); font: 11px Consolas, monospace; padding: 6px 8px; border-radius: 6px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); }

    /* Time & weather */
    .envrow { display: flex; align-items: center; gap: 10px; }
    #hourSel { flex: 1; accent-color: var(--accent); }
    #hourLbl { font: 600 11.5px Consolas, monospace; color: var(--ink); min-width: 136px; text-align: right; }
    .wx-pills { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
    .wx-pill { padding: 6px 2px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.04);
      color: var(--dim); font: 600 10.5px "Segoe UI", sans-serif; cursor: pointer; text-align: center; transition: .15s; }
    .wx-pill:hover { border-color: rgba(49,208,255,0.5); color: var(--ink); }
    .wx-pill.on { border-color: var(--accent); background: rgba(49,208,255,0.16); color: var(--accent); }

    /* Airport & runways */
    .apt-name { font-size: 16px; font-weight: 700; line-height: 1.2; }
    .apt-sub { color: var(--accent); font: 11.5px Consolas, monospace; margin-top: 3px; }
    #runways { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .rw { padding: 8px 9px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.04); color: var(--ink);
      cursor: pointer; font: 700 13px Consolas, monospace; text-align: left; transition: .15s; }
    .rw:hover { border-color: rgba(255,210,63,0.5); }
    .rw small { display: block; color: var(--dim); font: 400 10.5px Consolas, monospace; margin-top: 2px; }
    .rw.on { border-color: var(--amber); background: rgba(255,190,59,0.14); box-shadow: inset 0 0 0 1px rgba(255,190,59,0.25); }

    /* Buttons */
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button.go { padding: 11px 12px; font: 700 13px "Segoe UI", sans-serif; letter-spacing: 0.3px; border-radius: 8px; border: 0; cursor: pointer;
      background: linear-gradient(180deg, #38d6ff, #138dc7); color: #02121c; box-shadow: 0 6px 18px rgba(21,144,201,0.35); transition: filter .15s; }
    button.go:hover:not(:disabled) { filter: brightness(1.1); }
    button.go.alt { background: rgba(255,255,255,0.08); color: var(--ink); border: 1px solid rgba(255,255,255,0.18); box-shadow: none; }
    button.go.alt:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    button.go.small { padding: 7px 11px; font-size: 11.5px; }
    button.go:disabled { opacity: 0.42; cursor: default; }
    .free { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
      background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.14); font: 11px Consolas, monospace; color: var(--dim); }

    /* Controls reference modal */
    .ctrl-modal { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: rgba(4,8,15,0.72); backdrop-filter: blur(6px); }
    .ctrl-modal.open { display: flex; }
    .ctrl-box { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow-y: auto; padding: 18px 20px; }
    .ctrl-box table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12.5px; }
    .ctrl-box td { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.07); }
    .ctrl-box td:first-child { color: var(--accent); font-family: Consolas, monospace; white-space: nowrap; width: 150px; }

    .leaflet-container { background: #080e1a; font: 12px "Segoe UI", sans-serif; }
    .leaflet-top.leaflet-left { top: 72px; left: 378px; }
    @media (max-width: 960px) {
      .docks { flex-direction: column; align-items: stretch; overflow-y: auto; pointer-events: auto; }
      .dock { width: 100%; max-height: none; overflow: visible; }
      .leaflet-top.leaflet-left { top: 80px; left: 10px; }
      #status { display: none; }
    }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas id="hud"></canvas>
  <div id="start"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
