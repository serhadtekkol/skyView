services:
  skyview:
    build: .
    container_name: skyview
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - PORT=5173
      - ADMIN_PASS=${ADMIN_PASS:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    external: true
